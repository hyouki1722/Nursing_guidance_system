    // 防抖函數 (Debounce)
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    let preferredVoice = null;

    function initSpeechSynthesis() {
      if (!isSpeechSupported) return;
      const loadVoices = () => {
        const voices = window.speechSynthesis.getVoices();
        // 優先挑選台灣/繁中語音，否則挑選任何中文語音
        preferredVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-HK')) 
                      || voices.find(v => v.lang.includes('zh')) 
                      || voices[0];
      };
      loadVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    // 修復 Bug 1：強制停止並重置語音 UI
    function stopSpeech() {
      if (isSpeechSupported && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
      const speechBtns = document.querySelectorAll('.speech-btn');
      speechBtns.forEach(b => {
        b.setAttribute('aria-pressed', 'false');
        b.querySelector('span').innerText = '朗讀說明';
        b.querySelector('i').className = 'ph-bold ph-speaker-high';
      });
      currentPlayingBtn = null;
    }

    function bindSpeechEvents() {
      if (!isSpeechSupported) {
        document.querySelectorAll('.speech-btn').forEach(btn => btn.style.display = 'none');
        return;
      }
      const speechBtns = document.querySelectorAll('.speech-btn');
      speechBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.guide-card');
          const title = card.querySelector('h2').innerText;
          const narrative = card.querySelector('.narrative-content').innerText;
          const fullText = `${title}。${narrative}`;

          if (window.speechSynthesis.speaking && currentPlayingBtn === btn) {
            stopSpeech();
            return;
          }

          stopSpeech();

          currentUtterance = new SpeechSynthesisUtterance(fullText);
          if (preferredVoice) currentUtterance.voice = preferredVoice;
          currentUtterance.lang = 'zh-TW';
          currentUtterance.rate = 0.9;

          btn.setAttribute('aria-pressed', 'true');
          btn.querySelector('span').innerText = '停止朗讀';
          btn.querySelector('i').className = 'ph-bold ph-stop-circle';
          currentPlayingBtn = btn;

          currentUtterance.onend = stopSpeech;
          currentUtterance.onerror = stopSpeech;

          window.speechSynthesis.speak(currentUtterance);
        });
      });
    }

    // ==========================================
    // 渲染與搜尋邏輯
    // ==========================================
    function calculateCardScore(card, query) {
      if (!query) return 1;
      let score = 0;
      const lowerQ = query.toLowerCase();
      if (card.groupTitle.toLowerCase().includes(lowerQ)) score += 50;
      card.keywords.forEach(kw => {
        if (kw.toLowerCase() === lowerQ) score += 40;
        else if (kw.toLowerCase().includes(lowerQ)) score += 20;
      });
      card.subLinks.forEach(sub => {
        if (sub.name.toLowerCase().includes(lowerQ)) score += 25;
      });
      card.mainTips.forEach(tip => {
        if (tip.toLowerCase().includes(lowerQ)) score += 10;
      });
      if (card.description.toLowerCase().includes(lowerQ)) score += 5;
      return score;
    }

    function renderCards(cardsToRender) {
      const container = document.getElementById('cardContainer');
      
      // 修復 Bug 2：重新渲染前務必終止任何正在進行的語音
      stopSpeech(); 
      
      container.innerHTML = '';

      if (cardsToRender.length === 0) {
        container.innerHTML = `
          <div class="no-result">
            <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
            <p style="font-size: 1.3em; font-weight: 800;">抱歉，找不到符合的照護資料</p>
            <p>請嘗試其他關鍵字，例如「發燒」、「傷口」或點選上方分類標籤。</p>
          </div>`;
        return;
      }

      cardsToRender.forEach(card => {
        const subLinksHtml = card.subLinks.map(sub => `
          <a href="${sub.url}" target="_blank" rel="noopener noreferrer" class="sublink-item" aria-label="開啟 ${sub.name} 雲端資料夾">
            <span>${sub.name}</span>
            <i class="ph-bold ph-arrow-square-out" aria-hidden="true"></i>
          </a>
        `).join('');

        const tipsHtml = card.mainTips.map(tip => `<li>${tip}</li>`).join('');

       // 改回直接讀取實體的 JPG 圖片檔案
        const imageContent = `
            <img src="${card.imgSrc}" alt="${card.imageNote}" loading="lazy" width="1200" height="655" 
                 style="display:block; width:100%; height:auto; max-height:480px; object-fit:contain; border-radius:12px;">
        `;

        const cardElement = document.createElement('article');
        cardElement.className = 'guide-card';
        cardElement.innerHTML = `
          <div class="card-title-bar">
            <h2><i class="ph-bold ${card.icon}" aria-hidden="true"></i> ${card.groupTitle}</h2>
            <div class="title-actions">
              <span class="tag-label">${card.badge}</span>
              <button class="speech-btn" type="button" aria-pressed="false" aria-label="朗讀本則衛教內容">
                <i class="ph-bold ph-speaker-high" aria-hidden="true"></i> <span>朗讀說明</span>
              </button>
            </div>
          </div>
          <div class="card-inner">
            <p style="font-size: 1.1em; font-weight: 700; margin-bottom: 0.85rem; color: var(--text-sub);">
              ${card.description}
            </p>
            <div class="image-box">
              ${imageContent}
            </div>
            <div class="narrative-content">
              <p style="font-weight: 800; margin-bottom: 0.5rem; color: var(--primary-color);">【日常照護與注意原則】：</p>
              <ul class="guide-list">${tipsHtml}</ul>
              <div class="warning-box">
                <h4><i class="ph-bold ph-warning-circle" aria-hidden="true"></i> 貼心提醒與警戒症狀</h4>
                <p>${card.caution}</p>
              </div>
            </div>
            <div class="sublink-grid">
              ${subLinksHtml}
            </div>
          </div>
        `;
        container.appendChild(cardElement);
      });

      bindSpeechEvents();
    }

    function applySearchAndFilter() {
      const activeTab = document.querySelector('.tab-btn[aria-selected="true"]');
      const activeCategory = activeTab ? activeTab.dataset.category : 'all';
      const query = document.getElementById('searchInput').value.trim();
      const summaryBox = document.getElementById('searchSummary');

      let filtered = guideData.filter(card => activeCategory === 'all' || card.category === activeCategory);

      if (query !== '') {
        const scored = filtered.map(card => ({ card, score: calculateCardScore(card, query) }))
                               .filter(item => item.score > 0)
                               .sort((a, b) => b.score - a.score);
        filtered = scored.map(item => item.card);

        summaryBox.style.display = 'block';
        summaryBox.innerText = `🔍 搜尋「${query}」：已為您推送最相關的 ${filtered.length} 個護理項目`;
      } else {
        summaryBox.style.display = 'none';
        summaryBox.innerText = '';
      }
      renderCards(filtered);
    }

    // ==========================================
    // 初始化事件綁定
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      initSpeechSynthesis();

      // localStorage 防呆機制 (因應 WebView 或無痕模式拋錯)
      let savedSize = 'normal';
      try {
        savedSize = localStorage.getItem('tm_font_size') || 'normal';
      } catch (e) { console.warn('localStorage 無法讀取'); }
      
      const sizeButtons = document.querySelectorAll('.size-btn');
      
      function applyFontSize(size) {
        document.body.classList.remove('font-large', 'font-xlarge');
        sizeButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.size === size));
        if (size === 'large') document.body.classList.add('font-large');
        if (size === 'xlarge') document.body.classList.add('font-xlarge');
      }

      applyFontSize(savedSize);

      sizeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const size = btn.dataset.size;
          applyFontSize(size);
          try { localStorage.setItem('tm_font_size', size); } catch (e) {}
        });
      });

      // 分類標籤切換與 aria-selected
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.setAttribute('aria-selected', 'false'));
          tab.setAttribute('aria-selected', 'true');
          applySearchAndFilter();
        });
      });

      // 搜尋綁定 (Debounce)
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', debounce(applySearchAndFilter, 150));

      renderCards(guideData);
    });
  </script>
</body>
</html>
