    // ==========================================
    // 智慧推播搜尋引擎 (加權演算法)
    // ==========================================
    function calculateCardScore(card, query) {
      if (!query) return 1;
      let score = 0;
      const lowerQ = query.toLowerCase();

      if (card.groupTitle.toLowerCase().includes(lowerQ)) score += 50;

      card.keywords.forEach(kw => {
        if (kw.toLowerCase() === lowerQ) score += 40;
        else if (kw.toLowerCase().includes(lowerQ)) score += 20;
      });

      card.subLinks.forEach(sub => {
        if (sub.name.toLowerCase().includes(lowerQ)) score += 25;
      });

      card.mainTips.forEach(tip => {
        if (tip.toLowerCase().includes(lowerQ)) score += 10;
      });

      if (card.description.toLowerCase().includes(lowerQ)) score += 5;

      return score;
    }

    // 渲染卡片至畫面
    function renderCards(cardsToRender) {
      const container = document.getElementById('cardContainer');
      container.innerHTML = '';

      if (cardsToRender.length === 0) {
        container.innerHTML = `
          <div class="no-result">
            <i class="ph ph-magnifying-glass"></i>
            <p style="font-size: 1.3em; font-weight: 800;">抱歉，找不到符合的照護資料</p>
            <p>請嘗試其他關鍵字，例如「發燒」、「傷口」、「肚子」或點選上方分類標籤。</p>
          </div>
        `;
        return;
      }

      cardsToRender.forEach(card => {
        const subLinksHtml = card.subLinks.map(sub => `
          <a href="${sub.url}" target="_blank" rel="noopener noreferrer" class="sublink-item">
            <span>${sub.name}</span>
            <i class="ph-bold ph-arrow-square-out"></i>
          </a>
        `).join('');

        const tipsHtml = card.mainTips.map(tip => `<li>${tip}</li>`).join('');

        // 動態處理圖片：如果有設定 imgSrc 則顯示實體圖片，否則顯示佔位符號
        const imageContent = card.imgSrc 
          ? `<img src="${card.imgSrc}" alt="${card.imageNote}" style="display:block; width:100%; height:auto; max-height:480px; object-fit:contain; border-radius: 12px;">`
          : `<i class="ph ph-image"></i><span>【此處預留：${card.imageNote}】</span>`;
          
        // 如果有圖片，則移除虛線外框與灰色背景
        const imageBoxStyle = card.imgSrc ? 'padding: 0; background: transparent; border: none;' : '';

        const cardElement = document.createElement('article');
        cardElement.className = 'guide-card';
        cardElement.dataset.category = card.category;
        cardElement.innerHTML = `
          <div class="card-title-bar">
            <h2><i class="ph-bold ${card.icon}"></i> ${card.groupTitle}</h2>
            <div class="title-actions">
              <span class="tag-label">${card.badge}</span>
              <button class="speech-btn" type="button" aria-label="朗讀本則內容">
                <i class="ph-bold ph-speaker-high"></i> <span>朗讀說明</span>
              </button>
            </div>
          </div>
          <div class="card-inner">
            <p style="font-size: 1.1em; font-weight: 700; margin-bottom: 0.85rem; color: var(--text-sub);">
              ${card.description}
            </p>

            <div class="image-box" style="${imageBoxStyle}">
              ${imageContent}
            </div>

            <div class="narrative-content">
              <p style="font-weight: 800; margin-bottom: 0.5rem; color: var(--primary-color);">【日常照護與注意原則】：</p>
              <ul class="guide-list">
                ${tipsHtml}
              </ul>

              <div class="warning-box">
                <h4><i class="ph-bold ph-warning-circle"></i> 貼心提醒與警戒症狀</h4>
                <p>${card.caution}</p>
              </div>
            </div>

            <p style="font-weight: 800; margin-top: 1rem; color: var(--text-main);">
              <i class="ph-bold ph-folder-open"></i> 點選開啟各專科衛教手冊與雲端單張 (Google Drive)：
            </p>
            <div class="sublink-grid">
              ${subLinksHtml}
            </div>
          </div>
        `;
        container.appendChild(cardElement);
      });

      bindSpeechEvents();
    }

    // 執行智慧篩選與排序推送
    function applySearchAndFilter() {
      const activeCategory = document.querySelector('.tab-btn.active').dataset.category;
      const query = document.getElementById('searchInput').value.trim();
      const summaryBox = document.getElementById('searchSummary');

      let filtered = guideData.filter(card => {
        return activeCategory === 'all' || card.category === activeCategory;
      });

      if (query !== '') {
        const scored = filtered.map(card => ({
          card: card,
          score: calculateCardScore(card, query)
        })).filter(item => item.score > 0);

        scored.sort((a, b) => b.score - a.score);
        filtered = scored.map(item => item.card);

        summaryBox.style.display = 'block';
        summaryBox.innerText = `🔍 搜尋「${query}」：已為您推送最相關的 ${filtered.length} 個護理項目（已依關聯度置頂排序）`;
      } else {
        summaryBox.style.display = 'none';
      }

      renderCards(filtered);
    }

    // ==========================================
    // 語音朗讀合成邏輯 (Web Speech API)
    // ==========================================
    let currentUtterance = null;
    let currentPlayingBtn = null;

    function bindSpeechEvents() {
      const speechBtns = document.querySelectorAll('.speech-btn');
      speechBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const card = btn.closest('.guide-card');
          const title = card.querySelector('h2').innerText;
          const narrative = card.querySelector('.narrative-content').innerText;
          const fullText = `${title}。${narrative}`;

          if (window.speechSynthesis.speaking && currentPlayingBtn === btn) {
            window.speechSynthesis.cancel();
            resetSpeechBtns();
            return;
          }

          window.speechSynthesis.cancel();
          resetSpeechBtns();

          currentUtterance = new SpeechSynthesisUtterance(fullText);
          currentUtterance.lang = 'zh-TW';
          currentUtterance.rate = 0.9;

          btn.classList.add('playing');
          btn.querySelector('span').innerText = '停止朗讀';
          btn.querySelector('i').className = 'ph-bold ph-stop-circle';
          currentPlayingBtn = btn;

          currentUtterance.onend = resetSpeechBtns;
          currentUtterance.onerror = resetSpeechBtns;

          window.speechSynthesis.speak(currentUtterance);
        });
      });
    }

    function resetSpeechBtns() {
      const speechBtns = document.querySelectorAll('.speech-btn');
      speechBtns.forEach(b => {
        b.classList.remove('playing');
        b.querySelector('span').innerText = '朗讀說明';
        b.querySelector('i').className = 'ph-bold ph-speaker-high';
      });
      currentPlayingBtn = null;
    }

    // ==========================================
    // 頁面初始化與互動事件
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      const sizeButtons = document.querySelectorAll('.size-btn');
      const savedSize = localStorage.getItem('tm_font_size') || 'normal';
      applyFontSize(savedSize);

      sizeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const size = btn.dataset.size;
          applyFontSize(size);
          localStorage.setItem('tm_font_size', size);
        });
      });

      function applyFontSize(size) {
        document.body.classList.remove('font-large', 'font-xlarge');
        sizeButtons.forEach(b => b.classList.remove('active'));

        if (size === 'large') document.body.classList.add('font-large');
        if (size === 'xlarge') document.body.classList.add('font-xlarge');

        const activeBtn = document.querySelector(`.size-btn[data-size="${size}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }

      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          applySearchAndFilter();
        });
      });

      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', () => {
        applySearchAndFilter();
      });

      renderCards(guideData);
    });
  </script>
